<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Zharick!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Lienzo interactivo de la galaxia */
        #galaxyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        /* Contenedor de la Fase Cósmica */
        #galaxy-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-in-out;
        }

        /* Título de neón galáctico */
        .cosmic-title {
            color: #ffffff;
            font-size: 2.5rem;
            text-align: center;
            font-weight: 800;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s ease, transform 2s ease;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px #ff75a0,
                         0 0 40px #9c27b0;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .cosmic-title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Botón travieso e interactivo */
        .cosmic-btn {
            position: absolute; /* Requerido para el movimiento libre */
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 117, 160, 0.5);
            border-radius: 50px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 117, 160, 0.2);
            transition: opacity 1s ease, background 0.3s, transform 0.1s ease, border-color 0.5s;
            z-index: 10;
            white-space: nowrap;
        }

        .cosmic-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .cosmic-btn.ready {
            border-color: #4caf50;
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Mensajes burlones flotantes */
        .taunt-message {
            position: absolute;
            color: #ffeb3b;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: popOut 1.2s forwards ease-out;
            z-index: 5;
        }

        @keyframes popOut {
            0% { opacity: 0; transform: scale(0.5) translateY(0); }
            15% { opacity: 1; transform: scale(1.1) translateY(-10px); }
            30% { transform: scale(1) translateY(-15px); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* ==========================================================================
           FASE DE LAS FLORES (OCULTA AL PRINCIPIO)
           ========================================================================== */
        #garden-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #111424, #04050a);
            transition: opacity 1.5s ease-in-out;
        }

        .garden-container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 35px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 85%;
            width: 450px;
        }

        .garden-container h1 {
            color: #ff75a0;
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 117, 160, 0.5);
        }

        .garden-container p {
            color: #e0e0e0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 10px 0;
        }

        /* Lluvia de pétalos */
        .petal {
            position: absolute;
            background-color: #ff9ebb;
            border-radius: 150px 0px 150px 0px;
            opacity: 0.7;
            animation: floatPetal 6s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes floatPetal {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }

        /* Estructura del jardín inferior */
        .garden-bed {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .flower-stem {
            width: 4px;
            height: 1px;
            background: #4caf50;
            position: relative;
            transform-origin: bottom;
            animation: growStem 3s ease-out forwards;
        }

        .flower-stem::after {
            content: '🌸';
            font-size: 28px;
            position: absolute;
            top: -22px;
            left: -12px;
            opacity: 0;
            transform: scale(0);
            animation: bloomFlower 1s 2.5s ease-out forwards;
        }

        @keyframes growStem {
            to { transform: scaleY(90); } /* Multiplica la altura visual */
        }

        @keyframes bloomFlower {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- LIENZO DE LA GALAXIA INTERACTIVA -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- INTERFAZ FASE 1 Y 2: GALAXIA Y BOTÓN -->
    <div id="galaxy-interface">
        <div class="cosmic-title" id="mainTitle">¡Feliz Cumpleaños,<br>ZHARICK! 🌟</div>
        <button class="cosmic-btn" id="runawayBtn">Presiona aquí para tu regalo ✨</button>
    </div>

    <!-- INTERFAZ FASE 3: JARDÍN DE FLORES -->
    <div id="garden-interface" id="gardenInterface">
        <div class="garden-container">
            <h1>¡Feliz Cumpleaños! 🎂🎉</h1>
            <p>Hoy es un día muy especial. Te deseo un año lleno de sonrisas, metas cumplidas y momentos mágicos.</p>
            <p>¡Espero que te guste este pequeño jardín digital hecho para ti! 🌸✨</p>
        </div>
        <div class="garden-bed" id="gardenBed"></div>
    </div>

       <script>
        // --- CONFIGURACIÓN E INICIALIZACIÓN DEL CANVAS ---
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGalaxy();
        });

        // --- SISTEMA DE PARTÍCULAS INTERACTIVAS (GALAXIA PREMIUM) ---
        let stars = [];
        const numStars = 450; 
        let mouseX = null;
        let mouseY = null;
        let isTouching = false;

        class Star {
            constructor() {
                this.reset();
                this.angle = Math.random() * Math.PI * 2;
            }

            reset() {
                this.distance = Math.random() * (Math.max(width, height) * 0.6) + 10;
                this.angle = 0;
                this.speed = (Math.random() * 0.008 + 0.002) * (150 / this.distance + 0.5);
                this.size = Math.random() * 1.8 + 0.5;
                const colors = ['#fff', '#fff', '#ffb6c1', '#e0b0ff', '#87cefa'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.x = width / 2;
                this.y = height / 2;
            }

            update() {
                this.angle += this.speed;
                
                const targetX = width / 2 + Math.cos(this.angle) * this.distance * 1.2;
                const targetY = height / 2 + Math.sin(this.angle) * this.distance * 0.8;

                // ¡CORREGIDO! Interacción física con el dedo/cursor
                if (isTouching && mouseX !== null && mouseY !== null) {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const distToMouse = Math.sqrt(dx * dx + dy * dy);

                    if (distToMouse < 180) {
                        const force = (180 - distToMouse) / 180;
                        this.x += (mouseX - this.x) * force * 0.08;
                        this.y += (mouseY - this.y) * force * 0.08;
                        return;
                    }
                }

                this.x += (targetX - this.x) * 0.05;
                this.y += (targetY - this.y) * 0.05;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                if (this.size > 1.4) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
            }
        }

        function initGalaxy() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animateGalaxy() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.15)';
            ctx.shadowBlur = 0;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateGalaxy);
        }

        // --- ¡CORREGIDO! MANEJO DE EVENTOS TÁCTILES EXTRAE EL DEDO CORRECTO ---
        const handleStart = (e) => {
            isTouching = true;
            const pointer = e.touches ? e.touches[0] : e;
            mouseX = pointer.clientX;
            mouseY = pointer.clientY;
        };

        const handleMove = (e) => {
            if (!isTouching) return;
            const pointer = e.touches ? e.touches[0] : e;
            mouseX = pointer.clientX;
            mouseY = pointer.clientY;
        };

        const handleEnd = () => {
            isTouching = false;
            mouseX = null;
            mouseY = null;
        };

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        window.addEventListener('touchstart', handleStart, { passive: true });
        window.addEventListener('touchmove', handleMove, { passive: true });
        window.addEventListener('touchend', handleEnd);

        initGalaxy();
        animateGalaxy();

        // --- LOGICA DE TIEMPOS Y FASES DEL JUEGO ---
        const title = document.getElementById('mainTitle');
        const btn = document.getElementById('runawayBtn');
        let escapeCount = 0;
        const maxEscapes = 3;

        setTimeout(() => {
            title.classList.add('visible'); 
        }, 3000); 

        setTimeout(() => {
            // ¡CORREGIDO! Sintaxis de asignación de estilos dinámicos
            btn.style.left = `calc(50% - ${btn.offsetWidth / 2}px)`;
            btn.style.top = `65%`;
            btn.classList.add('visible');
        }, 7000); 


        // --- COMPORTAMIENTO DEL BOTÓN TRAVIESO ---
        function moveButtonTemplate(e) {
            if (escapeCount >= maxEscapes) return;

            e.preventDefault(); 
            
            const padding = 40;
            const randomX = Math.random() * (width - btn.offsetWidth - padding * 2) + padding;
            const randomY = Math.random() * (height - btn.offsetHeight - padding * 2) + padding;

            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;

            let tauntText = "";
            if (escapeCount === 0) tauntText = "¡Casi, pero no! 🤭";
            else if (escapeCount === 1) tauntText = "¡El Guido es más rápido jajaj! ⚡";
            else if (escapeCount === 2) tauntText = "¡Muy lenta! 🛑";

            createTauntMessage(tauntText);
            escapeCount++;

            if (escapeCount === maxEscapes) {
                setTimeout(() => {
                    btn.style.left = `calc(50% - ${btn.offsetWidth / 2}px)`;
                    btn.style.top = `65%`;
                    btn.innerText = "¡Vale, ya te dejo pasar! Presiona aquí 🥳";
                    btn.classList.add('ready');
                }, 800);
            }
        }

        btn.addEventListener('mouseenter', moveButtonTemplate);
        btn.addEventListener('touchstart', moveButtonTemplate);

        function createTauntMessage(text) {
            const msg = document.createElement('div');
            msg.classList.add('taunt-message');
            msg.innerText = text;
            // ¡CORREGIDO! Concatenación de strings con backticks
            msg.style.left = `calc(${btn.style.left} + 10px)`;
            msg.style.top = `calc(${btn.style.top} - 30px)`;
            document.getElementById('galaxy-interface').appendChild(msg);
            
            setTimeout(() => msg.remove(), 1200);
        }

        // --- TRANSICIÓN FINAL AL JARDÍN DE FLORES ---
        btn.addEventListener('click', (e) => {
            if (escapeCount < maxEscapes) return;

            const galaxyUI = document.getElementById('galaxy-interface');
            const gardenUI = document.getElementById('garden-interface');

            galaxyUI.style.opacity = '0';
            canvas.style.transition = 'opacity 1.5s ease';
            canvas.style.opacity = '0';

            setTimeout(() => {
                galaxyUI.style.display = 'none';
                canvas.style.display = 'none';
                
                gardenUI.style.display = 'flex';
                setTimeout(() => {
                    gardenUI.style.opacity = '1';
                    startFlowerGarden();
                }, 50);
            }, 1500);
        });

        // --- SISTEMA DEL JARDÍN DIGITAL (FLORES Y PÉTALOS) ---
        function startFlowerGarden() {
            function createPetal() {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 15 + 10 + 'px';
                petal.style.height = Math.random() * 15 + 10 + 'px';
                petal.style.animationDuration = Math.random() * 3 + 4 + 's';
                petal.style.opacity = Math.random() * 0.6 + 0.4;
                
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 6000);
            }
            setInterval(createPetal, 300);

            const bed = document.getElementById('gardenBed');
            const totalFlowers = Math.floor(window.innerWidth / 50); 
            
            for (let i = 0; i < totalFlowers; i++) {
                setTimeout(() => {
                    const stem = document.createElement('div');
                    stem.classList.add('flower-stem');
                    const randomScale = Math.random() * 50 + 40;
                    // ¡CORREGIDO! Sintaxis correcta para la transformación CSS
                    stem.style.transform = `scaleY(${randomScale})`;
                    bed.appendChild(stem);
                }, i * 250); 
            }
        }
    </script>
