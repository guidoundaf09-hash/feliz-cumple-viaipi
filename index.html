<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#040309">
<title>Para Zharick · 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============ BASE ============ */
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#040309;overscroll-behavior:none;position:fixed;inset:0}
  body{font-family:'Jost',sans-serif;color:#eae6f0}

  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #galaxyCanvas{z-index:1;opacity:1;transition:opacity 1.6s ease}
  #heartCanvas{z-index:3;display:none;opacity:0;transition:opacity 1.4s ease}
  #fallCanvas{z-index:4;display:none;opacity:0;transition:opacity 1.4s ease}

  /* ============ FASE 1: GALAXIA + TÍTULO ============ */
  #galaxy-interface{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1.4s ease}
  .title-block{text-align:center;padding:0 24px;will-change:transform}
  .overline{font-size:clamp(.62rem,2.6vw,.8rem);font-weight:400;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#ffb3c6;opacity:0;filter:blur(4px);transform:translateY(12px);transition:all 1.2s ease}
  .title-main{font-family:'Cormorant Garamond',serif;font-weight:500;color:#fff;font-size:clamp(2rem,7vw,3.4rem);line-height:1.15;margin-top:14px;opacity:0;filter:blur(8px);transform:translateY(16px);transition:all 1.5s ease}
  .title-main em{font-style:italic;font-weight:700;color:#ffd9e4}
  .title-divider{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:24px;opacity:0;transition:opacity 1.3s ease .15s}
  .title-divider span{display:block;height:1px;width:clamp(40px,12vw,70px);background:linear-gradient(to right,transparent,rgba(255,179,198,.75))}
  .title-divider span:last-child{background:linear-gradient(to left,transparent,rgba(255,179,198,.75))}
  .title-divider i{width:7px;height:7px;background:#ffb3c6;transform:rotate(45deg);box-shadow:0 0 12px rgba(255,92,134,.9)}
  .overline.visible,.title-main.visible,.title-divider.visible{opacity:1;filter:blur(0);transform:translateY(0)}

  /* ============ FASE 2: BOTÓN FUGITIVO ============ */
  .cosmic-btn{position:absolute;padding:14px 26px;font-family:'Jost',sans-serif;font-size:clamp(.92rem,3.4vw,1.05rem);font-weight:500;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;opacity:0;pointer-events:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;max-width:80vw;white-space:normal;text-align:center;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);transition:opacity .9s ease,border-color .4s,box-shadow .4s,background .3s,transform .15s}
  .cosmic-btn.visible{opacity:1;pointer-events:auto}
  .cosmic-btn:active{transform:scale(.95)}
  .cosmic-btn svg{width:19px;height:19px;flex:0 0 auto;stroke:#ffb3c6}
  .cosmic-btn.ready{border-color:rgba(110,231,160,.75);box-shadow:0 0 26px rgba(110,231,160,.35),inset 0 1px 0 rgba(255,255,255,.08);animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  .taunt{position:absolute;z-index:7;padding:9px 16px;border-radius:999px;background:rgba(12,10,20,.75);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ffd9e4;font-size:clamp(.78rem,3vw,.95rem);font-weight:500;white-space:nowrap;pointer-events:none;animation:taunt 1.25s cubic-bezier(.22,.9,.3,1) forwards}
  @keyframes taunt{0%{opacity:0;transform:translateY(6px) scale(.7)}18%{opacity:1;transform:translateY(-6px) scale(1)}70%{opacity:1;transform:translateY(-26px) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(.96)}}

  .spark{position:absolute;z-index:9;width:5px;height:5px;border-radius:50%;pointer-events:none;animation:spark .55s ease-out forwards}
  @keyframes spark{0%{opacity:.95;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

  /* ============ FASE 3: CORAZÓN 3D ============ */
  #heart-interface{position:absolute;top:10%;left:0;width:100%;z-index:6;display:none;opacity:1;transition:opacity 1.5s ease;pointer-events:none;text-align:center}
  .heart-title{display:flex;align-items:center;justify-content:center;gap:18px;padding:0 20px}
  .heart-title h2{font-family:'Jost',sans-serif;font-weight:300;font-size:clamp(1.05rem,4.5vw,1.65rem);letter-spacing:.85em;margin-right:-.5em;color:#fff;text-shadow:0 0 26px rgba(255,92,134,.5);opacity:0;transition:opacity 1.8s ease,letter-spacing 2.4s ease}
  #heart-interface.visible .heart-title h2{opacity:1;letter-spacing:.5em;margin-right:-.5em}
  .ht-line{height:1px;flex:0 0 clamp(30px,9vw,90px);transform:scaleX(0);transition:transform 1.5s ease .3s}
  .ht-line.l{background:linear-gradient(to right,rgba(255,179,198,0),rgba(255,179,198,.75))}
  .ht-line.r{background:linear-gradient(to left,rgba(255,179,198,0),rgba(255,179,198,.75))}
  #heart-interface.visible .ht-line{transform:scaleX(1)}
  .heart-hint{margin-top:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.95rem,3.4vw,1.15rem);color:#8f8798;opacity:0;transition:opacity 1.4s ease}
  .heart-hint.visible{opacity:.9}

  /* Botón de sonido */
  #muteBtn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:20;width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(12,10,20,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;color:#cfc8da;transition:color .3s,border-color .3s}
  #muteBtn.visible{display:flex}
  #muteBtn svg{width:18px;height:18px}
  #muteBtn .off{display:none}
  #muteBtn.muted .on{display:none}
  #muteBtn.muted .off{display:block}
  #muteBtn.muted{color:#6f6879}

  /* ============ FASE 5: FONDO DEL TÚNEL — CONTINUARÁ ============ */
  #fall-final{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 1.8s ease;padding:24px;pointer-events:none}
  #fall-final.visible{opacity:1}
  .ph-frame{position:relative;text-align:center;padding:clamp(38px,7vw,64px) clamp(28px,8vw,72px);border:1px solid rgba(255,255,255,.12);max-width:520px;background:rgba(8,6,14,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transform:translateY(16px);transition:opacity 1.2s ease .3s,transform 1.2s ease .3s}
  #fall-final.visible .ph-frame{opacity:1;transform:none}
  .ph-frame .c{position:absolute;width:14px;height:14px;border-color:rgba(255,179,198,.7);border-style:solid}
  .c1{top:-1px;left:-1px;border-width:1px 0 0 1px}
  .c2{top:-1px;right:-1px;border-width:1px 1px 0 0}
  .c3{bottom:-1px;left:-1px;border-width:0 0 1px 1px}
  .c4{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
  .ph-ornament{width:26px;height:26px;margin:0 auto 18px;color:#ffb3c6;animation:slowspin 9s linear infinite}
  @keyframes slowspin{to{transform:rotate(360deg)}}
  .ph-overline{font-size:.68rem;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:#ffb3c6}
  .ph-frame h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(1.5rem,5.5vw,2.2rem);color:#fff;margin-top:10px}
  .ph-frame p{margin-top:12px;font-size:clamp(.8rem,3vw,.95rem);font-weight:300;color:#9a93a6;letter-spacing:.04em}
</style>
</head>
<body>

  <!-- LIENZOS -->
  <canvas id="galaxyCanvas"></canvas>
  <canvas id="heartCanvas"></canvas>
  <canvas id="fallCanvas"></canvas>

  <!-- FASE 1 + 2: GALAXIA, TÍTULO Y BOTÓN -->
  <div id="galaxy-interface">
    <div class="title-block" id="titleBlock">
      <div class="overline" id="tOverline">21 &middot; la galaxia celebra hoy</div>
      <h1 class="title-main" id="tMain">Feliz Cumplea&ntilde;os,<br><em>Zharick</em></h1>
      <div class="title-divider" id="tDivider"><span></span><i></i><span></span></div>
    </div>
    <button class="cosmic-btn" id="runawayBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <span id="btnLabel">Toca para abrir tu regalo</span>
    </button>
  </div>

  <!-- FASE 3: CORAZÓN -->
  <div id="heart-interface">
    <div class="heart-title">
      <span class="ht-line l"></span>
      <h2>FOR MY VIAIPI</h2>
      <span class="ht-line r"></span>
    </div>
    <div class="heart-hint" id="heartHint">toca la pantalla</div>
  </div>

  <!-- CONTROL DE SONIDO -->
  <button id="muteBtn" aria-label="Silenciar m&uacute;sica">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
  </button>

  <!-- FASE 5: FONDO DEL TÚNEL -->
  <div id="fall-final">
    <div class="ph-frame">
      <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
      <svg class="ph-ornament" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M12 2l10 10-10 10L2 12z"/><path d="M12 7.5l4.5 4.5-4.5 4.5-4.5-4.5z"/></svg>
      <div class="ph-overline">La sorpresa contin&uacute;a</div>
      <h2>Continuar&aacute;&hellip;</h2>
      <p>La siguiente interfaz est&aacute; en camino</p>
    </div>
  </div>

<script>
'use strict';

/* ==================== AJUSTES RÁPIDOS ==================== */
const AJUSTES = {
  escapesBoton: 3,
  mensajesBurla: ["¡Casi, pero no! 🤭", "¡El Guido es más rápido jajaj! ⚡", "¡Muy lenta! 🛑"],
  textoRendision: "¡Vale, ya te dejo pasar! Presiona aquí 🥳",
  /* Mensaje que se escribe DENTRO del corazón */
  mensajeCorazon: ["TE DESEO", "LO MEJOR", "Abigail"],
  /* Frases del túnel de caída (en orden). La primera sale más grande. */
  frasesTunel: [
    "FELICES 21 AÑOS",
    "ZHARICK ABIGAIL",
    "HOY EL UNIVERSO CELEBRA",
    "21 VUELTAS AL SOL",
    "CADA ESTRELLA TE APLAUDE",
    "BRILLAS CON LUZ PROPIA",
    "ERES ÚNICA EN ESTE UNIVERSO",
    "ESTE AÑO ES TUYO",
    "SUEÑA EN GRANDE",
    "QUE TODO SE CUMPLA",
    "VIAIPI ♥",
    "LA GRAVEDAD NO PUEDE CONTIGO",
    "FELICIDAD SIN LÍMITES",
    "21"
  ]
};

/* ==================== BASE Y PUNTERO ==================== */
const gCanvas = document.getElementById('galaxyCanvas');
const gCtx = gCanvas.getContext('2d');
const hCanvas = document.getElementById('heartCanvas');
const hCtx = hCanvas.getContext('2d');
const fCanvas = document.getElementById('fallCanvas');
const fCtx = fCanvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function sizeCanvas(cv, ctx){
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const ptr = { x:null, y:null, has:false, down:false };
const app = { phase:'galaxy' };
let galaxyActive = true;

window.addEventListener('pointerdown', e => {
  ptr.down = true; ptr.has = true; ptr.x = e.clientX; ptr.y = e.clientY;
  if (app.phase === 'heart') document.getElementById('heartHint').classList.remove('visible');
});
window.addEventListener('pointermove', e => {
  ptr.has = true; ptr.x = e.clientX; ptr.y = e.clientY;
  parallaxTitulo(e);
});
window.addEventListener('pointerup',    () => { ptr.down = false; });
window.addEventListener('pointercancel',() => { ptr.down = false; });
document.documentElement.addEventListener('mouseleave', () => { ptr.has = false; });

/* Precarga de fuentes */
if (document.fonts && document.fonts.load){
  document.fonts.load('500 100px Jost');
  document.fonts.load('italic 600 100px "Cormorant Garamond"');
}

/* ==================== FASE 1: GALAXIA ==================== */

const nebCanvas = document.createElement('canvas');
function paintNebula(){
  nebCanvas.width = W; nebCanvas.height = H;
  const c = nebCanvas.getContext('2d');
  c.fillStyle = '#040309'; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'screen';
  const blobs = [
    ['150,30,80',  .17], ['255,110,160', .07],
    ['60,60,150',  .15], ['255,170,110', .05],
    ['120,40,110', .10], ['40,80,140',   .09]
  ];
  blobs.forEach(b => {
    const x = W * (0.15 + 0.7 * Math.random());
    const y = H * (0.15 + 0.7 * Math.random());
    const r = Math.max(W, H) * (0.3 + Math.random() * 0.32);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${b[0]},${b[1]})`);
    g.addColorStop(1, `rgba(${b[0]},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  });
  c.globalCompositeOperation = 'source-over';
  const v = c.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}

function makeGlow(rgb){
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, `rgba(${rgb},1)`);
  g.addColorStop(0.28, `rgba(${rgb},0.65)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  return s;
}
const coreSprite = makeGlow('255,190,205');

const STAR_COLORS = ['#ffffff','#fff6e8','#ffd9e6','#e8dcff','#cfe6ff'];
let stars = [];

class Star{
  constructor(){
    this.dist = Math.pow(Math.random(), 0.72) * Math.max(W, H) * 0.62 + 8;
    this.ang = Math.random() * Math.PI * 2;
    this.spd = (0.02 + Math.random() * 0.07) * (140 / (this.dist + 60) + 0.35);
    this.size = Math.random() < 0.06 ? Math.random() * 1.6 + 1.7 : Math.random() * 1.1 + 0.4;
    this.color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
    this.tw = Math.random() * 6.28; this.twS = 0.5 + Math.random() * 1.9;
    this.bright = this.size > 1.8;
    this.x = W / 2; this.y = H / 2;
  }
  update(dt){
    this.ang += this.spd * dt;
    const tx = W/2 + Math.cos(this.ang) * this.dist * 1.25;
    const ty = H/2 + Math.sin(this.ang) * this.dist * 0.85;
    if (ptr.has){
      const dx = ptr.x - this.x, dy = ptr.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 190 && d > 1){
        const f = (1 - d / 190) * 4.2 * dt;
        this.x += dx * f; this.y += dy * f;
      }
    }
    const e = Math.min(1, 2.2 * dt);
    this.x += (tx - this.x) * e; this.y += (ty - this.y) * e;
  }
  draw(ctx, t){
    const a = 0.55 + 0.45 * Math.sin(this.tw + t * this.twS);
    if (this.bright){
      ctx.globalAlpha = a * 0.35; ctx.strokeStyle = this.color; ctx.lineWidth = 0.7;
      const l = this.size * 5;
      ctx.beginPath();
      ctx.moveTo(this.x - l, this.y); ctx.lineTo(this.x + l, this.y);
      ctx.moveTo(this.x, this.y - l); ctx.lineTo(this.x, this.y + l);
      ctx.stroke();
    }
    ctx.globalAlpha = a; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.2832); ctx.fill();
  }
}

function initStars(){
  const n = Math.min(W, H) < 520 ? 300 : 440;
  stars = [];
  for (let i = 0; i < n; i++) stars.push(new Star());
}

/* Estrellas fugaces de fondo */
let shooters = [], nextShoot = 1.2;
function spawnShooter(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  shooters.push({
    x: W * 0.15 + Math.random() * W * 0.7, y: Math.random() * H * 0.32,
    vx: dir * (300 + Math.random() * 260), vy: 140 + Math.random() * 120,
    life: 0, max: 0.9 + Math.random() * 0.4
  });
}
function drawShooters(dt){
  nextShoot -= dt;
  if (nextShoot <= 0){
    spawnShooter();
    if (Math.random() < 0.35) spawnShooter();
    nextShoot = 1.1 + Math.random() * 1.7;
  }
  shooters = shooters.filter(s => s.life < s.max);
  for (const s of shooters){
    s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    const a = Math.sin(Math.PI * Math.min(1, s.life / s.max));
    const tx = s.x - s.vx * 0.16, ty = s.y - s.vy * 0.16;
    const g = gCtx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, `rgba(255,255,255,${0.9 * a})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    gCtx.strokeStyle = g; gCtx.lineWidth = 1.6;
    gCtx.beginPath(); gCtx.moveTo(s.x, s.y); gCtx.lineTo(tx, ty); gCtx.stroke();
    gCtx.globalAlpha = a; gCtx.fillStyle = '#fff';
    gCtx.beginPath(); gCtx.arc(s.x, s.y, 1.6, 0, 6.2832); gCtx.fill();
  }
  gCtx.globalAlpha = 1;
}

let lastGalaxy = performance.now();
function loopGalaxy(now){
  if (!galaxyActive) return;
  requestAnimationFrame(loopGalaxy);
  const dt = Math.min(0.05, (now - lastGalaxy) / 1000); lastGalaxy = now;
  const t = now / 1000;
  gCtx.drawImage(nebCanvas, 0, 0, W, H);
  gCtx.globalAlpha = 0.10 + 0.05 * Math.sin(t * 0.7);
  const cs = Math.min(W, H) * 0.55;
  gCtx.drawImage(coreSprite, W/2 - cs/2, H/2 - cs/2, cs, cs);
  gCtx.globalAlpha = 1;
  for (const s of stars){ s.update(dt); s.draw(gCtx, t); }
  gCtx.globalAlpha = 1;
  drawShooters(dt);
}

/* ==================== FASE 1: TÍTULO Y PARALLAX ==================== */
const titleBlock = document.getElementById('titleBlock');
const tOverline = document.getElementById('tOverline');
const tMain = document.getElementById('tMain');
const tDivider = document.getElementById('tDivider');

function parallaxTitulo(e){
  if (app.phase !== 'galaxy') return;
  const nx = e.clientX / W - 0.5, ny = e.clientY / H - 0.5;
  titleBlock.style.transform = `translate(${(-nx * 10).toFixed(1)}px, ${(-ny * 8).toFixed(1)}px)`;
}

setTimeout(() => tOverline.classList.add('visible'), 700);
setTimeout(() => tMain.classList.add('visible'), 1350);
setTimeout(() => tDivider.classList.add('visible'), 2150);

/* ==================== FASE 2: BOTÓN FUGITIVO ==================== */
const galaxyUI = document.getElementById('galaxy-interface');
const btn = document.getElementById('runawayBtn');
const btnLabel = document.getElementById('btnLabel');
let escapes = 0, ready = false;

function placeBtn(x, y){
  const bw = btn.offsetWidth || 180, bh = btn.offsetHeight || 50;
  const pad = 18;
  const lx = Math.max(pad, Math.min(W - bw - pad, x - bw / 2));
  const ly = Math.max(pad + 50, Math.min(H - bh - pad - 16, y - bh / 2));
  btn.style.left = lx + 'px'; btn.style.top = ly + 'px';
}
setTimeout(() => { placeBtn(W / 2, H * 0.68); btn.classList.add('visible'); }, 4300);

function spawnSparks(x, y){
  for (let i = 0; i < 7; i++){
    const s = document.createElement('i'); s.className = 'spark';
    const ang = Math.random() * Math.PI * 2, r = 26 + Math.random() * 34;
    s.style.left = x + 'px'; s.style.top = y + 'px';

/* ==================== MOTOR DE MÚSICA 1: CAJA DE MÚSICA (galaxia/corazón) ==================== */
const AudioEngine = (() => {
  let ctx = null, master = null, delaySend = null, revSend = null;
  let running = false, muted = false, timer = null;
  let nextChord = 0, chordIdx = 0, nextNote = 0, arpIdx = 4;

  const CHORDS = [
    { pad:[45,52,57,61,64], bass:33 },
    { pad:[40,47,52,56,59], bass:28 },
    { pad:[42,49,54,57,61], bass:30 },
    { pad:[38,45,50,54,57], bass:26 }
  ];
  const SCALE = [57,59,61,64,66,69,71,73,76,78];
  const f = m => 440 * Math.pow(2, (m - 69) / 12);

  function impulse(dur, decay){
    const rate = ctx.sampleRate, len = Math.floor(rate * dur);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.0001;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ctx.destination);
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.38;
    const fb = ctx.createGain(); fb.gain.value = 0.33;
    const fbF = ctx.createBiquadFilter(); fbF.type = 'lowpass'; fbF.frequency.value = 2400;
    delay.connect(fbF); fbF.connect(fb); fb.connect(delay);
    delaySend = ctx.createGain(); delaySend.gain.value = 0.4; delaySend.connect(delay);
    const dOut = ctx.createGain(); dOut.gain.value = 0.5; delay.connect(dOut); dOut.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = impulse(2.8, 2.6);
    revSend = ctx.createGain(); revSend.gain.value = 0.5; revSend.connect(conv);
    const rOut = ctx.createGain(); rOut.gain.value = 0.55; conv.connect(rOut); rOut.connect(master);
  }

  function bell(t, midi, vel){
    const fr = f(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14 * vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = fr;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = fr * 3.01;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.035 * vel, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(master); g.connect(delaySend); g.connect(revSend);
    o1.start(t); o2.start(t); o1.stop(t + 2.3); o2.stop(t + 0.6);
  }

  function pad(t, chord, dur){
    chord.pad.forEach(m => {
      [-5, 5].forEach(det => {
        const o = ctx.createOscillator(); o.type = 'triangle';
        o.frequency.value = f(m); o.detune.value = det;
        const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 760;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.02, t + dur * 0.45);
        g.gain.linearRampToValueAtTime(0.014, t + dur * 0.95);
        g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.5);
        o.connect(fl); fl.connect(g); g.connect(master); g.connect(revSend);
        o.start(t); o.stop(t + dur + 1.6);
      });
    });
    const b = ctx.createOscillator(); b.type = 'sine'; b.frequency.value = f(chord.bass);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.linearRampToValueAtTime(0.05, t + dur * 0.4);
    bg.gain.linearRampToValueAtTime(0.0001, t + dur + 1.2);
    b.connect(bg); bg.connect(master);
    b.start(t); b.stop(t + dur + 1.3);
  }

  function schedule(){
    const ahead = ctx.currentTime + 0.4;
    while (nextChord < ahead){
      pad(nextChord, CHORDS[chordIdx % CHORDS.length], 4.2);
      nextChord += 4; chordIdx++;
    }
    while (nextNote < ahead){
      if (Math.random() > 0.14){
        arpIdx = Math.max(0, Math.min(SCALE.length - 1, arpIdx + Math.floor(Math.random() * 5) - 2));
        bell(nextNote, SCALE[arpIdx], 0.5 + Math.random() * 0.5);
      }
      nextNote += 0.34;
    }
  }

  function start(){
    if (running) return; running = true;
    build();
    if (ctx.state === 'suspended') ctx.resume();
    nextChord = ctx.currentTime + 0.15;
    nextNote = ctx.currentTime + 0.9;
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.85, ctx.currentTime + 2.5);
    timer = setInterval(schedule, 120);
  }
  function stop(){
    if (!running) return;
    clearInterval(timer);
    try{
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 2.2);
    }catch(e){}
    setTimeout(() => { try{ ctx.close(); }catch(e){} ctx = null; running = false; }, 2600);
  }
  function toggleMute(){
    muted = !muted;
    if (ctx && master){
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.85, now + 0.4);
    }
    return muted;
  }
  return { start, stop, toggleMute };
})();

/* ==================== MOTOR DE MÚSICA 2: PASIÓN (túnel) ==================== */
const MusicPassion = (() => {
  let ctx = null, master = null, delaySend = null, revSend = null;
  let running = false, muted = false, timer = null, finaleFired = false;
  let nextChord = 0, chordIdx = 0, nextNote = 0, arpIdx = 2, nextBeat = 0;

  /* Progresión pasión en Re menor: Dm9 - Bbmaj7 - Fadd9 - C(add9) */
  const CHORDS = [
    { pad:[50,53,57,60,64], bass:38 },
    { pad:[46,50,53,57,62], bass:34 },
    { pad:[53,57,60,64,67], bass:41 },
    { pad:[48,52,55,60,62], bass:36 }
  ];
  const SCALE = [62,65,67,69,72,74,77,81]; // pentatónica de Re menor
  const f = m => 440 * Math.pow(2, (m - 69) / 12);

  function impulse(dur, decay){
    const rate = ctx.sampleRate, len = Math.floor(rate * dur);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.0001;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -22; comp.knee.value = 20; comp.ratio.value = 3.5;
    master.connect(comp); comp.connect(ctx.destination);
    const delay = ctx.createDelay(1.2); delay.delayTime.value = 0.45;
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    const fbF = ctx.createBiquadFilter(); fbF.type = 'lowpass'; fbF.frequency.value = 2600;
    delay.connect(fbF); fbF.connect(fb); fb.connect(delay);
    delaySend = ctx.createGain(); delaySend.gain.value = 0.45; delaySend.connect(delay);
    const dOut = ctx.createGain(); dOut.gain.value = 0.55; delay.connect(dOut); dOut.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = impulse(3.6, 2.2);
    revSend = ctx.createGain(); revSend.gain.value = 0.55; revSend.connect(conv);
    const rOut = ctx.createGain(); rOut.gain.value = 0.6; conv.connect(rOut); rOut.connect(master);
  }

  /* Campana dulce de pasión */
  function bell(t, midi, vel){
    const fr = f(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16 * vel, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = fr;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = fr * 2.99;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.045 * vel, t + 0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(master); g.connect(delaySend); g.connect(revSend);
    o1.start(t); o2.start(t); o1.stop(t + 3.1); o2.stop(t + 0.7);
  }

  /* Cuerdas emotivas (saw suave filtrado, ataque lento, vibrato) */
  function strings(t, notes, dur){
    notes.forEach(m => {
      [-7, 7].forEach(det => {
        const o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = f(m); o.detune.value = det;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 4.6 + Math.random();
        const lg = ctx.createGain(); lg.gain.value = 3.2;
        lfo.connect(lg); lg.connect(o.detune);
        const fl = ctx.createBiquadFilter(); fl.type = 'lowpass';
        fl.frequency.setValueAtTime(420, t);
        fl.frequency.linearRampToValueAtTime(1150, t + dur * 0.55);
        fl.Q.value = 0.8;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.017, t + dur * 0.5);
        g.gain.linearRampToValueAtTime(0.012, t + dur * 0.95);
        g.gain.linearRampToValueAtTime(0.0001, t + dur + 2.0);
        o.connect(fl); fl.connect(g); g.connect(master); g.connect(revSend);
        o.start(t); o.stop(t + dur + 2.1); lfo.start(t); lfo.stop(t + dur + 2.1);
      });
    });
  }

  function bass(t, midi, dur){
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f(midi);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f(midi - 12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.25);
    g.gain.linearRampToValueAtTime(0.04, t + dur * 0.8);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.8);
    o.connect(g); o2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.9); o2.stop(t + dur + 0.9);
  }

  /* Latido de corazón (lub-dub), muy al fondo */
  function thump(t, f0, f1, vol){
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + 0.16);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.42);
  }

  function schedule(){
    const ahead = ctx.currentTime + 0.45;
    while (nextChord < ahead){
      const ch = CHORDS[chordIdx % CHORDS.length];
      strings(nextChord, ch.pad, 4.4);
      bass(nextChord, ch.bass, 4.4);
      nextChord += 4.2; chordIdx++;
    }
    while (nextNote < ahead){
      if (Math.random() > 0.10){
        arpIdx = Math.max(0, Math.min(SCALE.length - 1, arpIdx + Math.floor(Math.random() * 5) - 2));
        bell(nextNote, SCALE[arpIdx], 0.45 + Math.random() * 0.45);
      }
      nextNote += 0.26;
    }
    while (nextBeat < ahead){
      thump(nextBeat, 62, 38, 0.5);
      thump(nextBeat + 0.30, 84, 52, 0.28);
      nextBeat += 1.55;
    }
  }

  function start(){
    if (running) return; running = true; finaleFired = false;
    build();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    nextChord = now + 0.2; nextNote = now + 1.1; nextBeat = now + 0.8;
    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(0.6, now + 3.0);
    master.gain.linearRampToValueAtTime(0.95, now + 26.0); // crescendo de la caída
    timer = setInterval(schedule, 120);
  }

  /* Acorde final majestuoso al llegar al fondo (Re mayor: luz) */
  function finale(){
    if (finaleFired || !running) return; finaleFired = true;
    clearInterval(timer); timer = null;
    const t = ctx.currentTime + 0.05;
    strings(t, [50,57,62,66,69,74], 8.5); // D3 A3 D4 F#4 A4 D5
    bass(t, 38, 8.5);
    bell(t + 0.1, 74, 1.0);
    bell(t + 0.55, 81, 0.75);
    bell(t + 1.1, 86, 0.6);
    try{
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.4);
      master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 9.5);
    }catch(e){}
    setTimeout(() => {
      try{ ctx.close(); }catch(e){}
      ctx = null; running = false;
      muteBtn.classList.remove('visible');
    }, 10500);
  }

  function toggleMute(){
    muted = !muted;
    if (ctx && master){
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.9, now + 0.4);
    }
    return muted;
  }
  return { start, finale, toggleMute };
})();

const heartUI = document.getElementById('heart-interface');
const heartHint = document.getElementById('heartHint');

const Heart = (() => {
  let particles = [], running = false, raf = null, t0 = 0, lastT = 0;
  let theta = 0, thetaV = 0, S = 80, cx = 0, cy = 0;
  let comets = [], nextComet = 0, nextWind = 2.0;
  let textSpec = null, spinTarget = null, spinStarted = false;
  const state = { nova:false, exited:false };
  const coreSprite = makeGlow('255,80,120');
  const textSprite = makeGlow('255,238,244');
  const cometPink = makeGlow('255,150,180');
  const cometWhite = makeGlow('255,255,255');

  const TL = {
    ash: 0.6, assemble: 2.0, spin: 6.3, cometStart: 7.5, windStart: 8.5,
    textIn: 29, spinUp: 55, nova: 60, end: 61.6
  };

  const PALETTE = [
    { rgb:'255,59,95',   w:0.42 }, { rgb:'255,102,138', w:0.26 },
    { rgb:'255,157,176', w:0.16 }, { rgb:'255,211,222', w:0.11 },
    { rgb:'255,255,255', w:0.05 }
  ];
  const sprites = PALETTE.map(p => makeGlow(p.rgb));
  function pickSprite(){
    let r = Math.random();
    for (let i = 0; i < PALETTE.length; i++){ r -= PALETTE[i].w; if (r <= 0) return i; }
    return 0;
  }

  function inside(x, y, z){
    const a = x*x + 2.25*y*y + z*z - 1;
    return a*a*a - x*x*z*z*z - 0.1125*y*y*z*z*z < 0;
  }
  function sample(n){
    const pts = []; let guard = 0;
    while (pts.length < n && guard < 300000){
      guard++;
      const x = Math.random() * 2.6 - 1.3, y = Math.random() * 2.4 - 1.2, z = Math.random() * 2.5 - 1.2;
      if (inside(x, y, z)) pts.push([x, y, z]);
    }
    return pts;
  }

  function relayout(){
    S = Math.min(Math.min(W, H) * 0.205, 170);
    cx = W / 2; cy = H / 2 + Math.min(W, H) * 0.02;
  }

  function buildTextSpec(){
    const msgs = AJUSTES.mensajeCorazon.filter(s => s && s.trim().length);
    const n = msgs.length;
    if (!n) return null;
    const last = n - 1;
    const RF = 100;
    const mc = document.createElement('canvas').getContext('2d');
    const fontOf  = i => i === last
      ? `italic 600 ${RF}px 'Cormorant Garamond', Georgia, serif`
      : `500 ${RF}px Jost, 'Segoe UI', Arial, sans-serif`;
    const trackOf = i => i === last ? 0.05 : 0.30;
    const strOf   = i => i === last ? msgs[i] : msgs[i].toUpperCase();
    const lhOf    = i => RF * (i === last ? 1.5 : 1.42);

    const widths = [];
    for (let i = 0; i < n; i++){
      mc.font = fontOf(i);
      let w = 0;
      for (const ch of strOf(i)) w += mc.measureText(ch).width + RF * trackOf(i);
      widths.push(Math.max(0, w - RF * trackOf(i)));
    }
    let totalH = 0; for (let i = 0; i < n; i++) totalH += lhOf(i);
    const maxW = Math.max(...widths, 1);

    const cw = Math.ceil(maxW) + 40, chh = Math.ceil(totalH) + 40;
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = chh;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.textBaseline = 'middle';
    let y = 20;
    for (let i = 0; i < n; i++){
      c.font = fontOf(i);
      let x = (cw - widths[i]) / 2;
      const my = y + lhOf(i) / 2;
      for (const ch of strOf(i)){
        c.fillText(ch, x, my);
        x += c.measureText(ch).width + RF * trackOf(i);
      }
      y += lhOf(i);
    }

    const data = c.getImageData(0, 0, cw, chh).data;
    const target = Math.floor(particles.length * 0.58);
    const collect = st => {
      const arr = [];
      for (let yy = 0; yy < chh; yy += st)
        for (let xx = 0; xx < cw; xx += st)
          if (data[(yy * cw + xx) * 4 + 3] > 140)
            arr.push([(xx - cw / 2) / RF, (yy - chh / 2) / RF]);
      return arr;
    };
    let step = 3, pts = collect(step);
    if (pts.length > target){
      step = Math.max(3, Math.round(step * Math.sqrt(pts.length / target)));
      pts = collect(step);
    }
    while (pts.length > target) pts.splice((Math.random() * pts.length) | 0, 1);

    const emW = maxW / RF, emH = totalH / RF;
    const k = Math.min(1.58 / emW, 1.02 / emH);
    let minNx = 1e9, maxNx = -1e9;
    const out = pts.map(q => {
      if (q[0] < minNx) minNx = q[0];
      if (q[0] > maxNx) maxNx = q[0];
      return { nx: q[0], ny: q[1] };
    });
    return { pts: out, k, zOff: 0.08, minNx, maxNx };
  }



  function buildReal(){
    const N = Math.min(W, H) < 520 ? 2100 : 3000;
    particles = sample(N).map(p => ({
      hx: p[0], hy: p[1], hz: p[2],
      ax: Math.random() * W, ay: Math.random() * H,
      x: 0, y: 0, init: false,
      delay: Math.random() * 2.1, pull: 0,
      role: 'heart', pullText: 0, pullShell: 0, txtSpr: false,
      nx: 0, tx3: 0, ty3: 0, tz3: 0, tDelay: 0,
      sx3: 0, sy3: 0, sz3: 0,
      ox: 0, oy: 0, ovx: 0, ovy: 0,
      spr: sprites[pickSprite()],
      base: 1.1 + Math.random() * 1.7,
      tw: Math.random() * 6.28, twS: 2 + Math.random() * 3,
      driftS: 0.4 + Math.random() * 0.8, driftP: Math.random() * 6.28,
      sx: 0, sy: 0, depth: 0, sc: 1, scEff: 1
    }));

    textSpec = buildTextSpec();
    const idx = particles.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }

    if (textSpec){
      const pts = textSpec.pts;
      const K = Math.min(pts.length, Math.floor(particles.length * 0.58));
      for (let i = 0; i < K; i++){
        const p = particles[idx[i]];
        const q = pts[(i * 7919) % pts.length];
        p.role = 'text';
        p.nx = q.nx;
        p.tx3 = q.nx * textSpec.k;
        p.tz3 = -q.ny * textSpec.k + textSpec.zOff;
        p.ty3 = 0.38 + (Math.random() - 0.5) * 0.03;
        p.tDelay = ((q.nx - textSpec.minNx) / (textSpec.maxNx - textSpec.minNx + 1e-6)) * 3.8
                 + Math.random() * 0.5;
      }
      for (let i = K; i < particles.length; i++){
        const p = particles[idx[i]];
        const sgn = p.hy === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(p.hy);
        p.sx3 = p.hx; p.sz3 = p.hz;
        p.sy3 = sgn * Math.max(Math.abs(p.hy), 0.56 + Math.random() * 0.10);
      }
    }
    relayout();
  }

  function spawnComet(){
    const p = particles[(Math.random() * particles.length) | 0];
    const ox = p.x + p.ox, oy = p.y + p.oy;
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = 260 + Math.random() * 300;
    comets.push({
      x: ox, y: oy,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      age: 0, max: 1.0 + Math.random() * 0.7,
      w: Math.random() < 0.4
    });
    for (const q of particles){
      const dx = q.x + q.ox - ox, dy = q.y + q.oy - oy;
      const d2 = dx * dx + dy * dy;
      if (d2 < 6400 && d2 > 1){
        const d = Math.sqrt(d2), f = (1 - d / 80) * 140;
        q.ovx += dx / d * f; q.ovy += dy / d * f;
      }
    }
  }
  function updateComets(dt, t){
    if (t > TL.cometStart && t < TL.nova){
      nextComet -= dt;
      if (nextComet <= 0){
        spawnComet();
        nextComet = (t < TL.textIn ? 1.0 : 2.4) + Math.random() * 1.2;
      }
    }
    comets = comets.filter(c => c.age < c.max);
    for (const c of comets){
      c.age += dt; c.x += c.vx * dt; c.y += c.vy * dt;
      const a = Math.sin(Math.PI * Math.min(1, c.age / c.max));
      const tx = c.x - c.vx * 0.14, ty = c.y - c.vy * 0.14;
      const g = hCtx.createLinearGradient(c.x, c.y, tx, ty);
      g.addColorStop(0, c.w ? `rgba(255,255,255,${0.85 * a})` : `rgba(255,170,200,${0.85 * a})`);
      g.addColorStop(1, 'rgba(255,140,170,0)');
      hCtx.strokeStyle = g; hCtx.lineWidth = 1.8; hCtx.lineCap = 'round';
      hCtx.beginPath(); hCtx.moveTo(c.x, c.y); hCtx.lineTo(tx, ty); hCtx.stroke();
      const sz = 10 + 10 * a;
      hCtx.globalAlpha = a;
      hCtx.drawImage(c.w ? cometWhite : cometPink, c.x - sz/2, c.y - sz/2, sz, sz);
    }
    hCtx.globalAlpha = 1;
  }

  function maybeWind(dt, t){
    if (t < TL.windStart || t > TL.textIn - 2) return;
    nextWind -= dt;
    if (nextWind > 0) return;
    nextWind = 5 + Math.random() * 2.5;
    const ex = cx + (Math.random() - 0.5) * S * 1.6;
    const ey = cy + (Math.random() - 0.5) * S * 1.2;
    const R = S * 1.7;
    for (const p of particles){
      const dx = p.x + p.ox - ex, dy = p.y + p.oy - ey;
      const d = Math.hypot(dx, dy);
      if (d < R && d > 1){
        const f = (1 - d / R) * (260 + Math.random() * 240);
        p.ovx += dx / d * f; p.ovy += dy / d * f;
      }
    }
  }

  function frame(now){
    if (!running) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.04, (now - lastT) / 1000 || 0.016); lastT = now;
    const t = (now - t0) / 1000;

    if (!state.exited && t >= TL.end) beginExit();

    if (!state.nova && t >= TL.nova){
      state.nova = true;
      for (const p of particles){
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.hypot(dx, dy) || 1;
        const sp = 150 + Math.random() * 430;
        p.nvx = dx / d * sp + (Math.random() - 0.5) * 170;
        p.nvy = dy / d * sp + (Math.random() - 0.5) * 170 - 70;
        p.ox = 0; p.oy = 0; p.ovx = 0; p.ovy = 0; p.scEff = 1;
      }
    }

    let sway = 0;
    if (t < TL.textIn){
      if (t > 2.6) thetaV += (0.5 - thetaV) * Math.min(1, dt * 0.8);
      theta += thetaV * dt;
    } else if (t < TL.spinUp){
      if (spinTarget === null) spinTarget = Math.round(theta / (Math.PI * 2)) * Math.PI * 2;
      theta += (spinTarget - theta) * Math.min(1, dt * 1.5);
      const fadeIn  = Math.min(1, Math.max(0, (t - TL.textIn - 4) / 1.5));
      const fadeOut = Math.min(1, Math.max(0, (TL.spinUp - t) / 1.5));
      sway = 0.10 * Math.sin(t * 0.65) * fadeIn * fadeOut;
    } else {
      if (!spinStarted){ spinStarted = true; thetaV = 0.12; }
      thetaV += (1.5 - thetaV) * Math.min(1, dt * 0.45);
      theta += thetaV * dt;
    }
    const cos = Math.cos(theta + sway), sin = Math.sin(theta + sway);

    const formed = Math.min(1, Math.max(0, (t - 3) / 2));
    const beat = 1 + formed * 0.045 * Math.pow(Math.abs(Math.sin(t * 2.6)), 3);
    const textG = Math.min(1, Math.max(0, (t - TL.textIn) / 3));
    const Sp = S * (1 + 0.07 * textG) * beat;
    const txtPulse = 0.86 + 0.30 * Math.pow(Math.abs(Math.sin(t * 2.6 + 0.4)), 3);
    const novaFade = state.nova ? Math.max(0, 1 - (t - TL.nova) / 1.9) : 1;

    hCtx.clearRect(0, 0, W, H);
    hCtx.globalAlpha = formed * (0.10 + 0.03 * Math.sin(t * 1.3)) * novaFade;
    const gs = Sp * 3.1;
    hCtx.drawImage(coreSprite, cx - gs/2, cy - gs/2, gs, gs);

    maybeWind(dt, t);

    for (const p of particles){
      if (state.nova){
        p.x += p.nvx * dt; p.y += p.nvy * dt;
        p.nvx *= (1 - 0.55 * dt); p.nvy *= (1 - 0.55 * dt);
        p.sx = p.x; p.sy = p.y; p.depth = 1.15;
        continue;
      }
      if (t > 0.7 + p.delay && p.pull < 1) p.pull = Math.min(1, p.pull + dt * 0.55);

      if (p.role === 'text'){
        if (t > TL.textIn + p.tDelay && p.pullText < 1) p.pullText = Math.min(1, p.pullText + dt * 0.8);
        if (p.pullText > 0){
          const kt = p.pullText * p.pullText * 2.6 * dt;
          p.hx += (p.tx3 - p.hx) * kt;
          p.hy += (p.ty3 - p.hy) * kt;
          p.hz += (p.tz3 - p.hz) * kt;
          if (p.pullText > 0.55 && !p.txtSpr){ p.spr = textSprite; p.txtSpr = true; }
        }
      } else if (t > TL.textIn - 1.2){
        if (p.pullShell < 1) p.pullShell = Math.min(1, p.pullShell + dt * 0.5);
        if (p.pullShell > 0){
          const ks = p.pullShell * p.pullShell * 2.2 * dt;
          p.hx += (p.sx3 - p.hx) * ks;
          p.hy += (p.sy3 - p.hy) * ks;
          p.hz += (p.sz3 - p.hz) * ks;
        }
      }

      const ashX = p.ax + Math.sin(t * p.driftS + p.driftP) * 26 + Math.sin(t * 0.23 + p.driftP * 2) * 18;
      const ashY = p.ay + Math.cos(t * p.driftS * 0.8 + p.driftP) * 22;
      if (!p.init){ p.x = ashX; p.y = ashY; p.init = true; }

      const rx = p.hx * cos - p.hy * sin;
      const ry = p.hx * sin + p.hy * cos;
      const sc = 4 / (4 - ry * 0.95);
      const tx = cx + rx * sc * Sp;
      const ty = cy - (p.hz - 0.06) * sc * Sp;

      const ka = (1 - p.pull) * 2.0 * dt;
      const kh = p.pull * p.pull * 3.5 * dt;
      p.x += (ashX - p.x) * ka; p.y += (ashY - p.y) * ka;
      p.x += (tx - p.x) * kh;  p.y += (ty - p.y) * kh;

      p.ovx += (-60 * p.ox - 5.5 * p.ovx) * dt;
      p.ovy += (-60 * p.oy - 5.5 * p.ovy) * dt;
      p.ox += p.ovx * dt; p.oy += p.ovy * dt;
      if (ptr.has){
        const dx = p.x + p.ox - ptr.x, dy = p.y + p.oy - ptr.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 12100 && d2 > 0.01){
          const d = Math.sqrt(d2);
          const fo = (1 - d / 110) * 1100 * dt;
          p.ovx += dx / d * fo; p.ovy += dy / d * fo;
        }
      }
      p.sx = p.x + p.ox; p.sy = p.y + p.oy;
      p.depth = ry; p.scEff = sc;
    }

    particles.sort((a, b) => a.depth - b.depth);
    for (const p of particles){
      const nd = Math.min(1, Math.max(0, (p.depth + 1.3) / 2.6));
      const twk = 0.82 + 0.18 * Math.sin(p.tw + t * p.twS);
      let a;
      if (p.role === 'text' && p.pullText > 0){
        const shimmer = 0.86 + 0.14 * Math.sin(t * 2.4 + p.nx * 6.0);
        const depthA = (0.16 + 0.84 * nd * nd) * twk;
        a = depthA * (1 - p.pullText) + 0.98 * txtPulse * shimmer * p.pullText;
      } else {
        a = (0.16 + 0.84 * nd * nd) * twk * (1 - 0.28 * textG);
      }
      const aAsh = 0.22 * twk;
      let alpha = (aAsh + (a - aAsh) * p.pull) * novaFade;
      if (alpha > 1) alpha = 1;
      const sz = p.base * (0.55 + 0.75 * nd) * p.scEff * (0.5 + 0.5 * p.pull) * (4.5 + 0.7 * (p.pullText || 0));
      hCtx.globalAlpha = alpha;
      hCtx.drawImage(p.spr, p.sx - sz/2, p.sy - sz/2, sz, sz);
    }
    hCtx.globalAlpha = 1;

    updateComets(dt, t);
  }

  function start(){
    buildReal();
    running = true; t0 = performance.now(); lastT = t0;
    theta = 0; thetaV = 0; spinTarget = null; spinStarted = false;
    state.nova = false; state.exited = false;
    comets = [];
    hCanvas.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => { hCanvas.style.opacity = '1'; }));
    raf = requestAnimationFrame(frame);
    setTimeout(() => heartUI.classList.add('visible'), 3300);
    setTimeout(() => heartHint.classList.add('visible'), 5000);
  }
  function beginExit(){
    if (state.exited) return;
    state.exited = true;
    hCanvas.style.opacity = '0';
    heartUI.style.opacity = '0';
    AudioEngine.stop();
    setTimeout(() => {
      running = false; cancelAnimationFrame(raf);
      hCanvas.style.display = 'none';
      heartUI.style.display = 'none';
      heartUI.classList.remove('visible');
      heartHint.classList.remove('visible');
      goFall();
    }, 1700);
  }
  return { start, relayout };
})();


/* ==================================================================
   FASE 4: EL TÚNEL DE CAÍDA (hélice 3D)
   Cada letra vive sobre la pared del túnel con un ángulo y una
   profundidad, formando una espiral. Tú caes por el centro.
   ================================================================== */
const Fall = (() => {
  /* ---- Calibración rápida ---- */
  const R      = 520;   // radio del túnel: más bajo = más íntimo
  const PITCH  = 1000;  // cuánto baja la hélice por vuelta completa
  const FONT_W = 92;    // tamaño de las letras
  const FAR    = 3200;  // hasta dónde se ve el túnel

  /* ---- Línea de tiempo de la caída (segundos) ---- */
  const TL = { accel:4, peakIn:12, peakOut:18, brakeIn:26, arrive:31.5, finalAt:34.6 };
  const VMAX = 150, PEAK = 205;
  const smooth = x => { x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); };
  function speedAt(t){
    if (t < TL.accel)   return VMAX * smooth(t / TL.accel);
    if (t < TL.peakIn)  return VMAX + (PEAK - VMAX) * smooth((t - TL.accel) / (TL.peakIn - TL.accel));
    if (t < TL.peakOut) return PEAK;
    if (t < TL.brakeIn) return PEAK - (PEAK - VMAX) * smooth((t - TL.peakOut) / (TL.brakeIn - TL.peakOut));
    if (t < TL.arrive)  return VMAX * (1 - smooth((t - TL.brakeIn) / (TL.arrive - TL.brakeIn)));
    return 0;
  }

  const LET_COLORS = [
    { fill:'#ffffff', glow:'rgba(255,120,160,.95)' },
    { fill:'#ffe9f0', glow:'rgba(255,190,130,.95)' },
    { fill:'#eaf1ff', glow:'rgba(150,190,255,.95)' },
    { fill:'#fff3e6', glow:'rgba(255,150,180,.95)' }
  ];

  /* ---- Medición y sprites de letras (pre-render con glow, rapidísimo) ---- */
  const measCtx = document.createElement('canvas').getContext('2d');
  const MEAS_FONT = '500 100px Jost, "Segoe UI", Arial, sans-serif';
  measCtx.font = MEAS_FONT;
  const measW = {};
  const charW = ch => {
    if (!(ch in measW)) measW[ch] = Math.max(18, measCtx.measureText(ch).width);
    return measW[ch];
  };

  const spriteCache = {};
  function letterSprite(ch, ci){
    const key = ch + '|' + ci;
    if (spriteCache[key]) return spriteCache[key];
    const pad = 40;
    const w = Math.ceil(charW(ch)) + pad * 2;
    const h = 100 + pad * 2;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    c.font = MEAS_FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
    const col = LET_COLORS[ci % LET_COLORS.length];
    c.shadowColor = col.glow; c.shadowBlur = 26;
    c.fillStyle = col.fill;
    c.fillText(ch, w/2, h/2 + 4);
    c.shadowBlur = 0;
    c.fillText(ch, w/2, h/2 + 4); // núcleo nítido encima del glow
    spriteCache[key] = cv;
    return cv;
  }

  /* ---- Estado ---- */
  let running = false, raf = null, t0 = 0, lastT = 0;
  let camZ = 0, tubeR = R;              // la cámara cae hacia -Z
  let letters = [], aros = [], dust = [];
  let nextZ = -900, nextAroZ = -400, spiralA = -Math.PI / 2, phraseIdx = 0;
  let spin = 0, spinV = 0.15;
  let arrived = false, finalShown = false, glow = 0;

  function spawnPhrase(zStart){
    const lista = AJUSTES.frasesTunel;
    const txt = lista[phraseIdx % lista.length].toUpperCase();
    const big = (phraseIdx === 0);
    const fs = big ? FONT_W * 1.4 : FONT_W;   // la primera frase más grande
    const ci = phraseIdx % LET_COLORS.length;
    let a = spiralA, z = zStart;
    for (const ch of txt){
      const w = charW(ch) * (fs / 100) + fs * 0.22;     // ancho + tracking
      if (ch !== ' ') letters.push({ ch, a, z, fs, ci });
      a += w / tubeR;                                   // avanza alrededor del tubo
      z -= w * PITCH / (2 * Math.PI * tubeR);           // y hacia el fondo (hélice)
    }
    spiralA = a + 0.7;                                  // la espiral continúa
    phraseIdx++;
    return z - fs * 2.2;                                // respiro entre frases
  }

  function initDust(){
    dust = [];
    for (let i = 0; i < 210; i++){
      dust.push({
        a: Math.random() * Math.PI * 2,
        r: tubeR * (0.35 + Math.random() * 0.75),
        z: -Math.random() * FAR,
        pink: Math.random() < 0.3
      });
    }
  }

  function frame(now){
    if (!running) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.04, (now - lastT) / 1000 || 0.016); lastT = now;
    const t = (now - t0) / 1000;

    const v = speedAt(t);
    camZ -= v * dt;

    if (!arrived && t >= TL.arrive){ arrived = true; MusicPassion.finale(); }
    if (arrived) glow = Math.min(1, (t - TL.arrive) / 2.4);
    if (!finalShown && t >= TL.finalAt){
      finalShown = true;
      document.getElementById('fall-final').classList.add('visible');
    }

    /* Generar túnel por delante de la cámara */
    while (nextZ > camZ - FAR) nextZ = spawnPhrase(nextZ);
    while (nextAroZ > camZ - FAR){ aros.push({ z: nextAroZ }); nextAroZ -= PITCH / 2; }

    /* Limpiar lo que ya pasó */
    letters = letters.filter(l => (camZ - l.z) > 30);
    aros    = aros.filter(r => (camZ - r.z) > 30);

    /* Giro global del tubo */
    const spinTarget = arrived ? 0.05 : (0.16 + v * 0.0016);
    spinV += (spinTarget - spinV) * Math.min(1, dt * 1.1);
    spin += spinV * dt;

    /* Cámara con balanceo */
    const swayK = Math.min(1, v / 140) * 0.8;
    const camX = W / 2 + Math.sin(t * 0.55) * 0.05 * W * swayK;
    const camY = H / 2 + Math.cos(t * 0.42) * 0.04 * H * swayK;
    const FOV = H * 1.05;

    /* Fondo */
    fCtx.fillStyle = '#05030b';
    fCtx.fillRect(0, 0, W, H);

    /* Resplandor central que late (al ritmo del corazón de la música) */
    const bp = Math.pow(Math.max(0, Math.sin(Math.PI * ((t % 1.55) / 1.55))), 3);
    const bgR = Math.min(W, H) * (0.34 + 0.16 * bp);
    const bg = fCtx.createRadialGradient(camX, camY, 0, camX, camY, bgR);
    bg.addColorStop(0, `rgba(255,120,160,${0.10 + 0.07 * bp})`);
    bg.addColorStop(1, 'rgba(255,120,160,0)');
    fCtx.fillStyle = bg;
    fCtx.fillRect(0, 0, W, H);

    /* Aros guía punteados (lejanos primero) */
    aros.sort((a, b) => (camZ - b.z) - (camZ - a.z));
    for (const r of aros){
      const depth = camZ - r.z;
      const k = FOV / depth;
      let al = Math.min(1, (FAR - depth) / 900) * Math.min(1, (depth - 30) / 260);
      if (al <= 0) continue;
      al *= 0.30 + 0.25 * Math.min(1, k);
      fCtx.strokeStyle = `rgba(255,190,205,${al})`;
      fCtx.lineWidth = Math.max(1, 1.6 * k);
      fCtx.setLineDash([4 + 6 * k, 16 + 26 * k]);
      fCtx.beginPath();
      fCtx.arc(camX, camY, tubeR * k, 0, 6.2832);
      fCtx.stroke();
    }
    fCtx.setLineDash([]);

    /* Polvo estelar: FIJO en el mundo → ahora sí pasa volando de verdad */
    fCtx.lineCap = 'round';
    for (const d of dust){
      d.a += dt * 0.03;
      const depth = camZ - d.z;
      if (depth < 26){ d.z = camZ - FAR - Math.random() * 500; continue; }
      const k1 = FOV / depth;
      const k2 = FOV / (depth + Math.max(34, v * 0.07)); // estela hacia el centro
      const ang = d.a + spin * 0.35;
      const x1 = camX + Math.cos(ang) * d.r * k1;
      const y1 = camY + Math.sin(ang) * d.r * k1;
      const x2 = camX + Math.cos(ang) * d.r * k2;
      const y2 = camY + Math.sin(ang) * d.r * k2;
      const near = Math.min(1, (FAR - depth) / 2400);
      const fadeN = Math.min(1, (depth - 26) / 200);
      const al = (0.10 + 0.34 * near) * fadeN;
      if (al <= 0.01) continue;
      fCtx.strokeStyle = d.pink ? `rgba(255,170,200,${al})` : `rgba(235,238,255,${al})`;
      fCtx.lineWidth = 1.4;
      fCtx.beginPath(); fCtx.moveTo(x1, y1); fCtx.lineTo(x2, y2); fCtx.stroke();
    }

    /* Letras sobre la pared del túnel (lejanas primero, cercanas encima) */
    letters.sort((a, b) => (camZ - b.z) - (camZ - a.z));
    for (const l of letters){
      const depth = camZ - l.z;
      const k = FOV / depth;
      const ang = l.a + spin;
      const x = camX + Math.cos(ang) * tubeR * k;
      const y = camY + Math.sin(ang) * tubeR * k;
      let al = Math.min(1, (FAR - depth) / 650) * Math.min(1, (depth - 40) / 300);
      if (al <= 0.01) continue;
      al = Math.min(1, al * (0.92 + 0.08 * Math.sin(t * 2.2 + l.a * 3 + l.z * 0.01)));
      const spr = letterSprite(l.ch, l.ci);
      const dw = spr.width * (l.fs / 100) * k;
      const dh = spr.height * (l.fs / 100) * k;
      fCtx.save();
      fCtx.translate(x, y);
      fCtx.rotate(ang + Math.PI / 2);   // la letra "de pie" sobre la pared
      fCtx.globalAlpha = al;
      fCtx.drawImage(spr, -dw / 2, -dh / 2, dw, dh);
      fCtx.restore();
    }
    fCtx.globalAlpha = 1;

    /* Luz del fondo al llegar */
    if (glow > 0){
      const gr = glow * glow * 1.35 * Math.max(W, H);
      const g = fCtx.createRadialGradient(camX, camY, 0, camX, camY, gr);
      g.addColorStop(0, `rgba(255,240,245,${0.9 * glow})`);
      g.addColorStop(0.4, `rgba(255,160,190,${0.4 * glow})`);
      g.addColorStop(1, 'rgba(255,120,160,0)');
      fCtx.fillStyle = g;
      fCtx.fillRect(0, 0, W, H);
    }
  }

  function start(){
    running = true; t0 = performance.now(); lastT = t0;
    camZ = 0; nextZ = -900; nextAroZ = -400;
    spiralA = -Math.PI / 2; phraseIdx = 0;
    letters = []; aros = []; spin = 0; spinV = 0.15;
    arrived = false; finalShown = false; glow = 0;
    tubeR = Math.min(R, Math.max(360, W * 1.2)); // en pantallas angostas el tubo se adapta
    initDust();
    fCanvas.style.display = 'block';
    document.getElementById('fall-final').style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => { fCanvas.style.opacity = '1'; }));
    raf = requestAnimationFrame(frame);
  }
  return { start };
})();

  

/* ==================== ORQUESTADOR DE FASES ==================== */
function goFall(){
  app.phase = 'fall';
  galaxyActive = false;              // apagamos la galaxia (ahorro)
  gCanvas.style.opacity = '0';
  setTimeout(() => {
    MusicPassion.start();
    musicBus = MusicPassion;
    muteBtn.classList.add('visible');
    Fall.start();
  }, 700);
}

btn.addEventListener('click', () => {
  if (!ready) return;
  app.phase = 'leaving';
  galaxyUI.style.opacity = '0';
  gCanvas.style.opacity = '0.3';
  AudioEngine.start();
  musicBus = AudioEngine;
  muteBtn.classList.add('visible');
  setTimeout(() => {
    galaxyUI.style.display = 'none';
    app.phase = 'heart';
    heartUI.style.display = 'block';
    heartUI.style.opacity = '1';
    Heart.start();
  }, 1400);
});

/* ==================== ARRANQUE Y RESIZE ==================== */
function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  sizeCanvas(gCanvas, gCtx); sizeCanvas(hCanvas, hCtx); sizeCanvas(fCanvas, fCtx);
  paintNebula(); initStars();
  Heart.relayout();
  if (btn.classList.contains('visible')) placeBtn(W / 2, H * 0.68);
}
window.addEventListener('resize', onResize);

sizeCanvas(gCanvas, gCtx);
sizeCanvas(hCanvas, hCtx);
sizeCanvas(fCanvas, fCtx);
paintNebula();
initStars();
requestAnimationFrame(loopGalaxy);
</script>
</body>
