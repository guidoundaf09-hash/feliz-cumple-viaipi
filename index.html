<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111424, #04050a);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 80%;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            color: #ff75a0;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 117, 160, 0.6);
        }

        p {
            color: #e0e0e0;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Lluvia de pétalos */
        .petal {
            position: absolute;
            background-color: #ff9ebb;
            border-radius: 150px 0px 150px 0px;
            opacity: 0.7;
            animation: float 6s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Flores que crecen abajo */
        .garden {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            pointer-events: none;
        }

        .flower {
            width: 20px;
            height: 60px;
            background: #4caf50;
            position: relative;
            animation: grow 3s ease-out forwards;
            transform-origin: bottom;
        }

        .flower::after {
            content: '🌸';
            font-size: 30px;
            position: absolute;
            top: -25px;
            left: -10px;
        }

        @keyframes grow {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Feliz Cumpleaños! 🎂🎉</h1>
        <p>Hoy es un día muy especial. Te deseo un año lleno de sonrisas, metas cumplidas y momentos mágicos.</p>
        <p>¡Espero que te guste este pequeño jardín digital hecho para ti! 🌸✨</p>
    </div>

    <div class="garden" id="garden"></div>

    <script>
        // Generador de pétalos flotantes
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 15 + 10 + 'px';
            petal.style.height = Math.random() * 15 + 10 + 'px';
            petal.style.animationDuration = Math.random() * 3 + 4 + 's';
            petal.style.opacity = Math.random();
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 7000);
        }
        setInterval(createPetal, 300);

        // Generar flores en el jardín inferior
        const garden = document.getElementById('garden');
        const totalFlowers = Math.floor(window.innerWidth / 60);
        
        for (let i = 0; i < totalFlowers; i++) {
            setTimeout(() => {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                // Alturas variadas para las flores
                flower.style.height = Math.random() * 60 + 40 + 'px';
                garden.appendChild(flower);
            }, i * 200);
        }
    </script>
</body>
</html>
